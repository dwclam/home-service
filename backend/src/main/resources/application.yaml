spring:
  application:
    name: home-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  # Enable together with the first reviewed schema migration.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    clean-disabled: true
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    otp-ttl: ${AUTH_OTP_TTL:10m}
    otp-resend-interval: ${AUTH_OTP_RESEND_INTERVAL:60s}
    otp-max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    login-rate-limit:
      max-attempts-per-email-and-ip: ${AUTH_LOGIN_MAX_ATTEMPTS_PER_EMAIL_IP:5}
      max-attempts-per-ip: ${AUTH_LOGIN_MAX_ATTEMPTS_PER_IP:30}
      window: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:1m}
  jwt:
    issuer: ${JWT_ISSUER:nestify}
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
  mail:
    from: ${MAIL_FROM:no-reply@nestify.local}
  security:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
    secure-cookies: ${COOKIE_SECURE:false}
