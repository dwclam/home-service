spring:
  application:
    name: home-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Enable together with the first reviewed schema migration.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    clean-disabled: true
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
    secure-cookies: ${COOKIE_SECURE:false}
  booking:
    policy:
      deposit-percent: 30
      platform-fee-percent: 20
      cancel-cutoff-minutes: 30
      early-refund-percent: 50
      late-refund-percent: 0
      provider-refund-percent: 100
      system-refund-percent: 100
      lead-time-minutes: 60
      request-expire-minutes: 30
